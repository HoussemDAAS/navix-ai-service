# Render Blueprint for the Navix AI service (FastAPI).
# Dashboard: New > Blueprint > pick this repo. Variables marked "sync: false" are asked once at creation.
services:
  - type: web
    name: navix-ai-service
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://ituecleocjmzyowwnqrm.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
